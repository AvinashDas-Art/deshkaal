name: देशकाल रोज़ का प्रसारण
on:
  push:
    branches: [main]
    paths: ["data/days/**"]
  workflow_dispatch:
    inputs:
      only:
        description: "सिर्फ़ एक हिस्सा भेजें: whatsapp, telegram या newsletter (ख़ाली = सब)"
        required: false
        default: ""

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: क्या नया अंक आया है? (पुराने अंक में सुधार पर दोबारा नहीं भेजना)
        id: check
        run: |
          if [ -f .github/hold-broadcast ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "new=no" >> "$GITHUB_OUTPUT"; elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only --diff-filter=A HEAD~1 HEAD -- data/days | grep -q .; then echo "new=yes" >> "$GITHUB_OUTPUT"; else echo "new=no" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.new == 'yes'
        with: { node-version: 20 }
      - name: साइट के अपडेट होने का इंतज़ार
        if: steps.check.outputs.new == 'yes'
        run: if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then sleep 300; fi
      - name: Telegram, न्यूज़लेटर और WhatsApp मसौदा
        if: steps.check.outputs.new == 'yes'
        run: node scripts/broadcast.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
