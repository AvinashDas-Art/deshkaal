name: प्रिव्यू कार्ड में असली तस्वीर
# Claude के रोज़ के रन से Unsplash तक पहुंच नहीं होती, इसलिए तस्वीर वाले लेखों के
# सोशल मीडिया कार्ड यहां (GitHub पर) दोबारा बनते हैं और साइट में लौट आते हैं।
on:
  push:
    branches: [main]
    paths: ["data/days/**", "scripts/og.py"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: og-photos, cancel-in-progress: false }
jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: देवनागरी के लिए ज़रूरी लाइब्रेरी
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 libfribidi0 libharfbuzz0b
          pip install -q pillow
          python3 -c "from PIL import features; assert features.check('raqm'), 'raqm missing'"
      - name: तस्वीर वाले कार्ड बनाना
        run: python3 scripts/og.py --photos
      - name: साइट में वापस भेजना
        run: |
          git add public/og data/og-photo || true
          if git diff --cached --quiet; then echo "कुछ नया नहीं"; exit 0; fi
          git -c user.name="deshkaal-bot" -c user.email="patra@deshkaal.xyz" commit -m "प्रिव्यू कार्ड में तस्वीर"
          git pull --rebase -q origin main && git push -q origin HEAD:main
