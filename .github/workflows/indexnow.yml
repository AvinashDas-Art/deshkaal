name: IndexNow (Bing, Yandex को नये पन्ने)
on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.js
      - run: node scripts/indexnow.js
