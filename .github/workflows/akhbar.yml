name: आज का अख़बार (PDF)
on:
  push:
    branches: [main]
    paths: ["data/days/**", "src/akhbar.css", "scripts/akhbar-pdf.js", "build.js"]
  workflow_dispatch:
    inputs:
      day:
        description: "किस दिन की PDF (YYYY-MM-DD, ख़ाली = आज का अंक)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: { group: akhbar-pdf, cancel-in-progress: false }
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Playwright
        run: |
          npm i --no-save playwright@1.47.2 pdf-lib@1.17.1
          npx playwright install --with-deps chromium
      - name: पेंटिंग उतारना (PDF में दिखें)
        run: |
          pip install -q pillow
          python3 scripts/media.py || true
      - name: साइट बनाना और PDF
        run: |
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ]; then DAY=$(ls data/days | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | cut -c1-10); fi
          node build.js
          (python3 -m http.server 8080 --directory dist >/dev/null 2>&1 &)
          sleep 2
          node scripts/akhbar-pdf.js "$DAY"
          # PDF हल्की करना (तस्वीरें 150 dpi); बिगड़े या बड़ी हो तो मूल रखना
          sudo apt-get install -y -qq ghostscript >/dev/null
          F="public/akhbar/$DAY.pdf"
          if gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -dPDFSETTINGS=/ebook -dColorImageResolution=150 -dGrayImageResolution=150 -sOutputFile=/tmp/small.pdf "$F" && [ -s /tmp/small.pdf ] && [ $(stat -c%s /tmp/small.pdf) -lt $(stat -c%s "$F") ]; then mv /tmp/small.pdf "$F"; fi
          ls -la "$F"
      - name: साइट में वापस भेजना
        run: |
          # चेकआउट उथला (shallow) है और बीच में दूसरे पुश आ जाते हैं, इसलिए rebase नहीं:
          # PDF अलग रखें, ताज़ा origin/main पर लौटें, PDF फिर रखें, पुश करें।
          mkdir -p /tmp/pdfout && cp public/akhbar/*.pdf /tmp/pdfout/ 2>/dev/null || true
          ls /tmp/pdfout | grep -q . || { echo "कोई PDF नहीं बनी"; exit 1; }
          for i in 1 2 3 4 5 6; do
            git fetch -q --depth=1 origin main
            git reset -q --hard FETCH_HEAD
            mkdir -p public/akhbar && cp /tmp/pdfout/*.pdf public/akhbar/
            git add public/akhbar
            if git diff --cached --quiet; then echo "कुछ नया नहीं"; exit 0; fi
            git -c user.name="deshkaal-bot" -c user.email="patra@deshkaal.xyz" commit -q -m "आज का अख़बार: PDF [skip ci]"
            if git push -q origin HEAD:main; then echo "PDF भेज दी गयी"; exit 0; fi
            sleep $((i*8))
          done
          exit 1
