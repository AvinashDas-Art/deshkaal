name: Facebook और Instagram
# सुबह 7:15 (IST) पूरा अंक, फिर 7:30 से रात 10 बजे तक हर आधे घंटे अगली ख़बर.
# FB_PAGE_ID, FB_PAGE_TOKEN, IG_USER_ID secrets न हों तो कुछ नहीं होता.
on:
  schedule:
    - cron: "45 1 * * *"
    - cron: "*/30 2-16 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: "morning या next", default: "next" }
permissions:
  contents: write
concurrency: { group: social, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: पोस्ट
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ "${{ github.event.schedule }}" = "45 1 * * *" ]; then MODE=morning; fi
          node scripts/social.js "${MODE:-next}"
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - name: "क्या गया, दर्ज करना (साइट दोबारा नहीं बनती, skip ci)"
        if: always()
        run: |
          git add data/social || true
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="deshkaal-bot" -c user.email="patra@deshkaal.xyz" commit -q -m "सोशल पोस्ट का हिसाब [skip ci]"
          git pull --rebase -q origin main && git push -q origin HEAD:main
