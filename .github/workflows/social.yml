name: Facebook और Instagram
# हर काम एक-दो मिनट का: सुबह 7:15 (IST) पूरा अंक (FB तस्वीरें + IG कैरोसेल), फिर हर घंटे अगली ख़बर, रात 10 बजे तक।
# पहले यह 6 घंटे तक जागकर इंतज़ार करता था, जिससे GitHub के मुफ़्त मिनट ख़त्म हो गये। अब कोई sleep नहीं।
# क्या-क्या गया, data/social/<दिन>.json में दर्ज रहता है, कुछ दोबारा नहीं जाता।
on:
  push:
    branches: [main]
    paths: [".github/run-social"]
  schedule:
    - cron: "45 1 * * *"
    - cron: "15 2-16 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: "morning या next", default: "next" }
permissions:
  contents: write
concurrency: { group: social, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "पोस्ट (सुबह का अंक और दिन भर की ख़बरें)"
        run: |
          git config user.name "deshkaal-bot"; git config user.email "patra@deshkaal.xyz"
          ist_min() { echo $(( ( $(date -u +%s) + 19800 ) % 86400 / 60 )); }
          record() {
            git add data/social 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "सोशल पोस्ट का हिसाब [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && return 0; sleep 5; done
          }
          MODE="${{ github.event.inputs.mode }}"
          SCHED="${{ github.event.schedule }}"
          [ "$SCHED" = "45 1 * * *" ] && MODE=morning
          [ -z "$MODE" ] && MODE=next
          m=$(ist_min)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ $m -lt 430 ] || [ $m -ge 1320 ]; }; then echo "सुबह 7:10 से रात 10 बजे के बाहर, कुछ नहीं भेजना"; exit 0; fi
          # सुबह वाला काम छूट गया हो तो पहला next ही पूरा अंक भेज दे (social.js खुद देखता है क्या जा चुका है)
          # पोस्ट फ़ेल हो (टोकन, API) तो रन लाल हो, पर जो जा चुका उसका हिसाब पहले दर्ज हो जाए
          rc=0; node scripts/social.js "$MODE" || rc=$?
          record
          if [ $rc -ne 0 ]; then echo "::error::सोशल पोस्ट फ़ेल (टोकन या API की ग़लती, ऊपर देखें)"; exit $rc; fi
