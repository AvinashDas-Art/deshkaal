name: Facebook और Instagram
# नया अंक चढ़ते ही चलता है: 7:15 (IST) तक रुककर पूरा अंक (FB तस्वीरें + IG कैरोसेल),
# फिर हर आधे घंटे अगली ख़बर, रात 10 बजे तक। GitHub एक काम को 6 घंटे से ज़्यादा नहीं चलने देता,
# इसलिए साढ़े पांच घंटे बाद ये ख़ुद को दोबारा चला देता है (mode: loop)।
# schedule सिर्फ़ बैक-अप है; क्या-क्या गया, data/social/<दिन>.json में दर्ज रहता है, कुछ दोबारा नहीं जाता।
on:
  push:
    branches: [main]
    paths: ["data/days/**", ".github/run-social"]
  schedule:
    - cron: "45 1 * * *"
    - cron: "*/30 2-16 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: "morning, next या loop", default: "next" }
permissions:
  contents: write
  actions: write
concurrency: { group: social, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: "पोस्ट (सुबह का अंक और दिन भर की ख़बरें)"
        run: |
          git config user.name "deshkaal-bot"; git config user.email "patra@deshkaal.xyz"
          ist_min() { echo $(( ( $(date -u +%s) + 19800 ) % 86400 / 60 )); }
          record() {
            git add data/social 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "सोशल पोस्ट का हिसाब [skip ci]"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && return 0; sleep 5; done
          }
          MODE="${{ github.event.inputs.mode }}"
          EV="${{ github.event_name }}"; SCHED="${{ github.event.schedule }}"
          NEWDAY=no
          if [ "$EV" = "push" ] && git diff --name-only --diff-filter=A HEAD~1 HEAD -- data/days | grep -q .; then NEWDAY=yes; fi
          if [ "$EV" = "push" ] && [ "$NEWDAY" = no ] && ! git diff --name-only HEAD~1 HEAD | grep -q run-social; then echo "पुराने अंक में सुधार, कुछ नहीं भेजना"; exit 0; fi
          [ "$SCHED" = "45 1 * * *" ] && MODE=morning
          [ "$EV" = "schedule" ] && [ -z "$MODE" ] && MODE=next
          [ "$NEWDAY" = yes ] && MODE=loop
          [ -z "$MODE" ] && MODE=next
          echo "mode=$MODE"
          if [ "$MODE" != loop ]; then node scripts/social.js "$MODE"; record; exit 0; fi
          # loop: 7:15 तक रुकना, सुबह का अंक, फिर हर 30 मिनट अगली ख़बर
          start=$SECONDS
          now=$(ist_min); if [ $now -lt 435 ]; then sleep $(( (435 - now) * 60 )); fi
          git pull -q origin main; node scripts/social.js morning || true; record
          while true; do
            [ $(ist_min) -ge 1320 ] && { echo "रात 10 बज गये"; break; }
            [ -f .social-done ] && break
            if [ $(( SECONDS - start )) -gt 19500 ]; then
              echo "साढ़े पांच घंटे पूरे, ख़ुद को दोबारा चला रहे हैं"; gh workflow run social.yml -f mode=loop --ref main; break
            fi
            sleep 1800
            git pull -q origin main; node scripts/social.js next || true; record
          done
